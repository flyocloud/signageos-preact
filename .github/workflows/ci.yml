# Type check, tests and build with the old-browser compatibility check on every push.
# Delete this file if the project lives on GitLab (see .gitlab-ci.yml).
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
